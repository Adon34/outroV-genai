groups:
  - name: diet_chatbot_alerts
    rules:
      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{name=~'diet_.*'}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for {{ $labels.name }}"

      - alert: HighMemoryUsage
        expr: (container_memory_usage_bytes{name=~'diet_.*'} / container_spec_memory_limit_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 90% for {{ $labels.name }}"

      - alert: DatabaseDown
        expr: up{job='postgres'} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL has been down for more than 1 minute"

      - alert: RedisDown
        expr: up{job='redis'} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 1 minute"

      - alert: BackendDown
        expr: up{job='backend'} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend API is down"
          description: "Backend API has been down for more than 1 minute"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~'5..'}[5m]) / rate(http_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 10% for 5 minutes"

      # New health matrix alerts
      - alert: ComponentUnhealthy
        expr: health_check_status == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Component is unhealthy"
          description: "{{ $labels.component }} is reporting unhealthy status"

      - alert: DatabaseConnectionPoolExhausted
        expr: database_connections_utilization_percent > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "Database connection pool utilization is above 90%"

      - alert: RedisMemoryHigh
        expr: redis_memory_utilization_percent > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory utilization is above 85%"

      - alert: HealthCheckSlowResponse
        expr: histogram_quantile(0.95, rate(health_check_response_time_ms_bucket[5m])) > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow health check responses"
          description: "95th percentile health check response time > 5 seconds"

      - alert: ChromaDBCollectionsMissing
        expr: chroma_collections_count == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ChromaDB has no collections"
          description: "ChromaDB vector database has 0 collections, may indicate data issues"