# docker-compose.yml
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: diet_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - diet_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: diet_redis
    command: redis-server --requirepass ${REDIS_PASSWORD} # redis-server /usr/local/etc/redis/redis.conf # 
    volumes:
      - redis_data:/data
      # - ./redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    networks:
      - diet_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ChromaDB Vector Database
  chroma-db:
    image: chromadb/chroma:latest
    container_name: diet_chroma
    volumes:
      - chroma_data:/chroma/chroma
    environment:
    - IS_PERSISTENT=TRUE
    - PERSIST_DIRECTORY=/chroma/chroma
    - ANONYMIZED_TELEMETRY=FALSE
    - CHROMA_TELEMETRY_IMPL=noop
    - CHROMA_OTEL_COLLECTION_ENDPOINT=
    - CHROMA_OTEL_SERVICE_NAME=
    - CHROMA_OTEL_GRANULARITY=none
    - CHROMA_SERVER_AUTHN_CREDENTIALS="" 
    - CHROMA_SERVER_AUTHN_PROVIDER=
    - CHROMA_SERVER_AUTHZ_PROVIDER=
    - CHROMA_SERVER_AUTHN_CREDENTIALS_FILE=
    - CHROMA_SERVER_CORS_ALLOW_ORIGINS="[\"*\"]"
    ports:
      - "8000:8000"
    networks:
      - diet_network
    healthcheck:
      test: ["CMD", "/usr/local/bin/chroma", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diet_backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data:/data
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma-db:
        condition: service_healthy
    networks:
      - diet_network
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # test: [ "CMD", "curl", "-f", "http://localhost:8000/health/live" ]
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diet_frontend
    environment:
      - REACT_APP_API_URL=/api
      - REACT_APP_WS_URL=/ws
    volumes:
      # - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - diet_network
    # command: npm start
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    build: ./nginx
    container_name: diet_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - diet_network
    restart: unless-stopped

  # Adminer (Database Management - optional)
  adminer:
    image: adminer:latest
    container_name: diet_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - diet_network
    profiles:
      - dev

networks:
  diet_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  chroma_data:
